services:
  db:
    image: postgis/postgis:15-3.4
    container_name: agrivision_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS wajib diisi di .env}
      POSTGRES_DB: ${DB_NAME:-agrivision}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: agrivision_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY wajib diisi di .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY wajib diisi di .env}
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: agrivision_backend
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASS:?DB_PASS wajib diisi di .env}@db:5432/${DB_NAME:-agrivision}
      - SECRET_KEY=${SECRET_KEY:-${JWT_SECRET:-}}
      - JWT_SECRET_KEY=${JWT_SECRET:-}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD:-}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT:-1}
      - USE_MINIO=${USE_MINIO:-true}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://localhost:9000}
      - MINIO_INTERNAL_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY wajib diisi di .env}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY wajib diisi di .env}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-agrivision-uploads}
      - GEE_SERVICE_ACCOUNT_B64=${GEE_SERVICE_ACCOUNT_B64}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - minio
    volumes:
      - ./backend:/app:z
      - ./backend/uploads:/app/uploads:z
    restart: unless-stopped


  frontend:
    build: ./frontend
    container_name: agrivision_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data: